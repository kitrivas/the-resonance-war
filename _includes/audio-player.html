<div class="audio-player" id="audioPlayer">
  <div class="player-inner">
    <div class="player-controls">
      <button class="player-btn" id="skipBack" title="Back 15s">&#8634;</button>
      <button class="player-btn play-btn" id="playPause">&#9654;</button>
      <button class="player-btn" id="skipFwd" title="Forward 15s">&#8635;</button>
      <div class="player-progress-wrap">
        <span class="player-time" id="currentTime">0:00</span>
        <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"><div class="progress-handle"></div></div></div>
        <span class="player-time" id="totalTime">0:00</span>
      </div>
      <button class="player-speed" id="speedBtn">1&times;</button>
      <button class="player-close" id="playerClose">&times;</button>
    </div>
  </div>
</div>
